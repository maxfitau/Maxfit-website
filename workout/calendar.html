<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>MaxFit — Workout History</title>
<meta name="theme-color" content="#111111" />
<meta name="robots" content="noindex" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../card/styles.css?v=20260910a" />
<link rel="stylesheet" href="styles.css?v=20260910a" />
<link rel="stylesheet" href="calendar.css?v=20260910a" />
</head>
<body>

<main class="card calendar" id="calendar">
  <div class="card__top">
    <a class="workout__back" id="backLink" href="./" aria-label="Back">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <span class="card__tag">Workout History</span>
  </div>

  <div class="calendar__nav">
    <button class="calendar__nav-btn" id="prevMonth" type="button" aria-label="Previous month">‹</button>
    <span class="calendar__month-label" id="monthLabel">—</span>
    <button class="calendar__nav-btn" id="nextMonth" type="button" aria-label="Next month">›</button>
  </div>

  <div class="calendar__weekdays">
    <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
  </div>
  <div class="calendar__grid" id="calendarGrid"></div>

  <p class="calendar__hint">Days with a logged workout are highlighted — tap one to see it.</p>

  <div class="calendar__detail" id="calendarDetail" hidden>
    <div class="calendar__detail-head">
      <span class="card__label card__label--red" id="calendarDetailDate">—</span>
      <button class="calendar__detail-close" id="calendarDetailClose" type="button" aria-label="Close">×</button>
    </div>
    <div class="calendar__detail-body" id="calendarDetailBody"></div>
  </div>

  <p class="status" id="status" hidden></p>
</main>

<script src="../card/sheet.js?v=20260910a"></script>
<script src="calendar.js?v=20260910a"></script>
</body>
</html>
