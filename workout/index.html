<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>MaxFit — Today's Workout</title>
<meta name="theme-color" content="#111111" />
<meta name="robots" content="noindex" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../card/styles.css" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<main class="card workout" id="workout">
  <div class="card__top">
    <a class="workout__back" id="backLink" href="../card/" aria-label="Back">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <span class="card__tag" id="pageTag">Today's Workout</span>
  </div>

  <div class="workout__picker" id="workoutPicker" hidden>
    <p class="workout__picker-hint">Which one are you doing today?</p>
    <div class="workout__picker-list" id="workoutPickerList"></div>
  </div>

  <div class="workout__list" id="exerciseList"></div>

  <div class="workout__done" id="workoutDone" hidden>
    <span class="card__label card__label--red">All Sets Logged</span>
    <p class="workout__done-text">Nice work — head back to your card.</p>
  </div>
</main>

<div class="status" id="status" hidden></div>

<script src="../card/sheet.js"></script>
<script src="app.js"></script>
</body>
</html>
