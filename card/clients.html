<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>MaxFit — Clients</title>
<meta name="theme-color" content="#111111" />
<meta name="robots" content="noindex" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://docs.google.com" />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css?v=20261027a" />
<link rel="stylesheet" href="clients.css?v=20261027a" />
</head>
<body>

<main class="card clients" id="clients">
  <div class="card__top">
    <a class="clients__back" id="backLink" href="./" aria-label="Back to my card">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <span class="card__tag">Clients</span>
  </div>

  <!-- The list: pick a client -->
  <section class="clients__list-view" id="listView">
    <a class="coach-links__row" href="../workout/builder.html">
      <span class="coach-links__text"><b>Workout builder</b><small>Write or change a client's workouts</small></span>
      <span class="coach-links__chevron" aria-hidden="true">›</span>
    </a>
    <label class="card__label" for="clientSearch">Find a client</label>
    <input class="picker__input" id="clientSearch" type="search" autocomplete="off" placeholder="Start typing a name" />
    <p class="clients__status" id="listStatus" role="status">Loading clients…</p>
    <div class="clients__list" id="clientList"></div>
  </section>

  <!-- One client: their workouts to log, and quick actions -->
  <section class="clients__detail-view" id="detailView" hidden>
    <button class="clients__change" id="changeClient" type="button">‹ All clients</button>
    <h2 class="clients__name" id="detailName"></h2>
    <p class="clients__meta" id="detailMeta"></p>

    <span class="card__label card__label--red">Log a workout</span>
    <div class="clients__workouts" id="workoutList"></div>
    <p class="clients__status" id="workoutStatus" role="status"></p>

    <span class="card__label">Also</span>
    <div class="clients__actions" id="actionList"></div>
  </section>
</main>

<script src="sheet.js?v=20261027b" defer></script>
<script src="clients.js?v=20261027b" defer></script>
</body>
</html>
