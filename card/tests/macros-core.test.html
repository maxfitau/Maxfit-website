<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Macro Maths Tests</title>
<style>
  :root { --bg: #111; --fg: #fff; --dim: #999; --red: #e00000; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 14px/1.4 -apple-system, system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  li { margin: 2px 0; }
  .pass { color: var(--dim); }
  .fail { color: var(--red); font-weight: 700; }
  #summary { font-weight: 700; margin-bottom: 12px; }
</style>
</head>
<body>
<h1>MacroCore unit tests</h1>
<div id="summary">Running…</div>
<ol id="results"></ol>

<script src="../macros-core.js"></script>
<script>
  /*
   * Unit tests for card/macros-core.js (the same file Apps Script runs as
   * MacrosCore.gs). No node on this project, so tests run in the browser:
   * open this page and every line should be grey. window.__testResults
   * holds { passed, failed, failures } for automated checks.
   */
  const results = [];
  function eq(name, actual, expected) {
    const ok = JSON.stringify(actual) === JSON.stringify(expected);
    results.push({ name, ok, actual, expected });
  }
  function near(name, actual, expected, tolerance) {
    const ok = Math.abs(actual - expected) <= (tolerance == null ? 0.001 : tolerance);
    results.push({ name, ok, actual, expected });
  }
  function truthy(name, value) {
    results.push({ name, ok: !!value, actual: value, expected: true });
  }

  const C = MacroCore;

  // --- 4 / 4 / 9 -----------------------------------------------------------
  eq("kcalFrom 10P 20C 5F = 165", C.kcalFrom(10, 20, 5), 165);
  eq("kcalFrom protein only", C.kcalFrom(25, 0, 0), 100);
  eq("kcalFrom fat only", C.kcalFrom(0, 0, 10), 90);
  eq("kcalFrom ignores blanks", C.kcalFrom("", undefined, null), 0);

  // --- scaling by grams ------------------------------------------------------
  const chicken = { kcal: 165, protein_g: 31, carbs_g: 0, fat_g: 3.6 };
  eq("scale 150g chicken", C.scale(chicken, 150), { kcal: 248, protein_g: 46.5, carbs_g: 0, fat_g: 5.4 });
  eq("scale 100g is per-100", C.scale(chicken, 100), { kcal: 165, protein_g: 31, carbs_g: 0, fat_g: 3.6 });
  eq("scale 0g is zero", C.scale(chicken, 0), { kcal: 0, protein_g: 0, carbs_g: 0, fat_g: 0 });
  eq("scale negative grams clamps to 0", C.scale(chicken, -50), { kcal: 0, protein_g: 0, carbs_g: 0, fat_g: 0 });
  eq("per100From 200g item", C.per100From({ kcal: 330, protein_g: 62, carbs_g: 0, fat_g: 7.2 }, 200), chicken);
  eq("per100From 0g is zero", C.per100From({ kcal: 330 }, 0), { kcal: 0, protein_g: 0, carbs_g: 0, fat_g: 0 });
  const roundTrip = C.scale(C.per100From({ kcal: 430, protein_g: 48, carbs_g: 40, fat_g: 7 }, 350), 350);
  eq("per100 → scale round-trips", roundTrip, { kcal: 430, protein_g: 48, carbs_g: 40, fat_g: 7 });

  // --- AI kcal reconciliation -------------------------------------------------
  eq("reconcile keeps kcal within 15%", C.reconcileKcal({ kcal: 210, protein_g: 30, carbs_g: 10, fat_g: 5 }), 210);
  eq("reconcile replaces kcal >15% off", C.reconcileKcal({ kcal: 500, protein_g: 30, carbs_g: 10, fat_g: 5 }), 205);
  eq("reconcile with no macros keeps stated", C.reconcileKcal({ kcal: 7, protein_g: 0, carbs_g: 0, fat_g: 0 }), 7);

  // --- totals -----------------------------------------------------------------
  eq(
    "sumTotals adds and rounds",
    C.sumTotals([
      { kcal: 248, protein_g: 46.5, carbs_g: 0, fat_g: 5.4 },
      { kcal: 195.4, protein_g: 4.1, carbs_g: 42.3, fat_g: 0.4 },
    ]),
    { kcal: 443, protein_g: 50.6, carbs_g: 42.3, fat_g: 5.8 }
  );
  eq("sumTotals empty", C.sumTotals([]), { kcal: 0, protein_g: 0, carbs_g: 0, fat_g: 0 });

  // --- the client's own targets (scope of practice, 2026-10-29) --------------------
  eq("targets: a normal day saves", C.checkTargets({ kcal: "2,000", protein_g: 120, carbs_g: 230, fat_g: 67 }).targets, { kcal: 2000, protein_g: 120, carbs_g: 230, fat_g: 67 });
  eq("targets: under 1,200 kcal is refused", C.checkTargets({ kcal: 1150, protein_g: 100, carbs_g: 100, fat_g: 40 }).ok, false);
  truthy("targets: …and points to a GP or dietitian", /GP or an Accredited Practising Dietitian/.test(C.checkTargets({ kcal: 1150, protein_g: 100, carbs_g: 100, fat_g: 40 }).errors[0]));
  eq("targets: exactly 1,200 is fine", C.checkTargets({ kcal: 1200, protein_g: 90, carbs_g: 130, fat_g: 35 }).ok, true);
  eq("targets: a blank one is asked for", C.checkTargets({ kcal: 2000, protein_g: "", carbs_g: 200, fat_g: 60 }).errors, ["Enter your protein."]);
  eq("targets: silly numbers are refused", C.checkTargets({ kcal: 2000, protein_g: 900, carbs_g: 200, fat_g: 60 }).ok, false);
  const sh = C.macroShares({ kcal: 2000, protein_g: 120, carbs_g: 230, fat_g: 67 });
  eq("shares: % of the client's calories", [sh.protein_g.pct, sh.carbs_g.pct, sh.fat_g.pct], [24, 46, 30]);
  eq("shares: inside the general ranges", [sh.protein_g.within, sh.carbs_g.within, sh.fat_g.within], [true, true, true]);
  eq("shares: the ranges are the NRV AMDRs", [C.AMDR.protein_g, C.AMDR.fat_g, C.AMDR.carbs_g], [[15, 25], [20, 35], [45, 65]]);
  eq("shares: outside a range is just flagged", C.macroShares({ kcal: 2000, protein_g: 200, carbs_g: 150, fat_g: 60 }).protein_g.within, false);
  eq("shares: what the macros add up to", sh.macroKcal, 2003);
  truthy("no target calculator any more", typeof C.calcTargets === "undefined" && typeof C.bmr === "undefined" && typeof C.suggestFill === "undefined");

  // --- labels & Open Food Facts --------------------------------------------------
  eq("serving '1 bar (68 g)'", C.parseServingGrams("1 bar (68 g)"), 68);
  eq("serving '33 g (2 biscuits)'", C.parseServingGrams("33 g (2 biscuits)"), 33);
  eq("serving '375ml'", C.parseServingGrams("375ml"), 375);
  eq("serving '1 serving (250 ml)'", C.parseServingGrams("1 serving (250 ml)"), 250);
  eq("serving '12,5 g'", C.parseServingGrams("12,5 g"), 12.5);
  eq("serving with no amount", C.parseServingGrams("1 pouch"), null);

  const off = C.normaliseOffProduct(
    {
      status: 1,
      product: {
        product_name: "Greek Yogurt Natural",
        brands: "Chobani, Chobani Fit",
        serving_size: "1 portion (160 g)",
        serving_quantity: 160,
        nutriments: { "energy-kcal_100g": 59, proteins_100g: 10.1, carbohydrates_100g: 4, fat_100g: 0.2 },
      },
    },
    "9310653106204"
  );
  eq("OFF found", off.found, true);
  eq("OFF brand is first brand", off.brand, "Chobani");
  eq("OFF per100", off.per100, { kcal: 59, protein_g: 10.1, carbs_g: 4, fat_g: 0.2 });
  eq("OFF serving grams", off.serving_g, 160);
  eq("OFF quality ok", off.quality, "ok");

  const kjOnly = C.normaliseOffProduct(
    { status: 1, product: { product_name: "Bar", nutriments: { "energy-kj_100g": 1674, proteins_100g: 30, carbohydrates_100g: 40, fat_100g: 15 } } },
    "123456"
  );
  near("OFF kJ-only → kcal", kjOnly.per100.kcal, 400.1, 0.1);
  eq("OFF serving from text missing → null", kjOnly.serving_g, null);

  eq("OFF not found", C.normaliseOffProduct({ status: 0 }, "9399999999994").found, false);
  eq(
    "OFF no nutrition → not found",
    C.normaliseOffProduct({ status: 1, product: { product_name: "Mystery", nutriments: {} } }, "1").reason,
    "no_nutrition"
  );
  eq(
    "OFF suspicious numbers flagged",
    C.normaliseOffProduct(
      { status: 1, product: { product_name: "Odd", nutriments: { "energy-kcal_100g": 371, proteins_100g: 3.8, carbohydrates_100g: 20.4, fat_100g: 3.8 } } },
      "9300652805048"
    ).quality,
    "check"
  );
  eq(
    "OFF drink unit is ml",
    C.normaliseOffProduct(
      { status: 1, product: { product_name: "Zero", serving_size: "375ml", nutriments: { "energy-kcal_100g": 0.3, proteins_100g: 0, carbohydrates_100g: 0, fat_100g: 0 } } },
      "1"
    ).unit,
    "ml"
  );

  // --- dates & meals ----------------------------------------------------------------
  eq("Sydney date crosses midnight before UTC", C.sydneyDate(new Date("2026-09-22T15:30:00Z")), "2026-09-23");
  eq("Sydney date during daylight saving", C.sydneyDate(new Date("2026-12-31T13:30:00Z")), "2027-01-01");
  eq("7am is breakfast", C.mealForHour(7), "breakfast");
  eq("1pm is lunch", C.mealForHour(13), "lunch");
  eq("4pm is a snack", C.mealForHour(16), "snack");
  eq("7pm is dinner", C.mealForHour(19), "dinner");
  eq("11pm is a snack", C.mealForHour(23), "snack");

  // --- Fuel AI plan state --------------------------------------------------------------------
  eq("addDays across a month", C.addDays("2026-09-28", 7), "2026-10-05");
  eq("daysBetween", C.daysBetween("2026-09-24", "2026-10-01"), 7);
  const trial0 = C.planState({ trial_started: "2026-09-24" }, "2026-09-24");
  eq("trial day 1: on, 7 days left", [trial0.access, trial0.kind, trial0.daysLeft], [true, "trial", 7]);
  const trial6 = C.planState({ trial_started: "2026-09-24" }, "2026-09-30");
  eq("trial day 7: on, 1 day left", [trial6.access, trial6.daysLeft], [true, 1]);
  const trial7 = C.planState({ trial_started: "2026-09-24" }, "2026-10-01");
  eq("day 8: trial over, off", [trial7.access, trial7.kind], [false, "trial_over"]);
  eq("paying (active): on", C.planState({ trial_started: "2026-01-01", plan_status: "active", plan_until: "2026-10-24" }, "2026-09-24").access, true);
  eq("card failed (past_due): still on", C.planState({ plan_status: "past_due" }, "2026-09-24").access, true);
  eq("cancelled after trial: off, lapsed", [C.planState({ trial_started: "2026-01-01", plan_status: "canceled" }, "2026-09-24").access, C.planState({ trial_started: "2026-01-01", plan_status: "canceled" }, "2026-09-24").kind], [false, "lapsed"]);
  eq("free month until today: on", C.planState({ trial_started: "2026-01-01", comp_until: "2026-09-24" }, "2026-09-24").access, true);
  eq("free month ended yesterday: off", C.planState({ trial_started: "2026-01-01", comp_until: "2026-09-23" }, "2026-09-24").access, false);
  eq("never opened Fuel: not started", C.planState({}, "2026-09-24").kind, "not_started");
  eq("tiers: trial is Diamond", C.planState({ trial_started: "2026-09-24" }, "2026-09-25").tier, "diamond");
  eq("tiers: trial over is Silver", C.planState({ trial_started: "2026-01-01" }, "2026-09-24").tier, "silver");
  eq("tiers: paying with no tier recorded is Gold", C.planState({ plan_status: "active" }, "2026-09-24").tier, "gold");
  eq("tiers: an old Platinum plan counts as Diamond", C.planState({ plan_status: "active", plan_tier: "platinum" }, "2026-09-24").tier, "diamond");
  eq("tiers: cancelled Diamond drops to Silver", [C.planState({ trial_started: "2026-01-01", plan_status: "canceled", plan_tier: "diamond" }, "2026-09-24").tier, C.planState({ trial_started: "2026-01-01", plan_status: "canceled", plan_tier: "diamond" }, "2026-09-24").access], ["silver", false]);
  eq("tiers: an old free Platinum month counts as Diamond", C.planState({ comp_until: "2026-10-20", comp_tier: "platinum" }, "2026-09-24").tier, "diamond");
  eq("tiers: a free Gold month doesn't downgrade paying Diamond", C.planState({ plan_status: "active", plan_tier: "diamond", comp_until: "2026-10-20", comp_tier: "gold" }, "2026-09-24").tier, "diamond");
  eq("tiers: paying Diamond", C.planState({ plan_status: "active", plan_tier: "diamond" }, "2026-09-24").tier, "diamond");
  eq("tiers: an unknown tier on file counts as Gold", C.planState({ plan_status: "active", plan_tier: "bronze" }, "2026-09-24").tier, "gold");
  eq("tiers: free month of Diamond", C.planState({ comp_until: "2026-10-20", comp_tier: "diamond" }, "2026-09-24").tier, "diamond");
  eq("tiers: a free Diamond month tops up paying Gold", C.planState({ plan_status: "active", plan_tier: "gold", comp_until: "2026-10-20", comp_tier: "diamond" }, "2026-09-24").tier, "diamond");
  eq("tiers: a free Gold month doesn't replace paying Gold", C.planState({ plan_status: "active", plan_tier: "gold", comp_until: "2026-10-20", comp_tier: "gold" }, "2026-09-24").kind, "paid");
  eq("tiers: rank order (old Platinum ranks as Diamond)", ["silver", "gold", "diamond", "platinum"].map(C.tierRank), [0, 1, 2, 2]);
  eq("interval: yearly plan", C.planState({ plan_status: "active", plan_tier: "gold", plan_interval: "year" }, "2026-09-24").interval, "year");
  eq("interval: monthly when blank", C.planState({ plan_status: "active", plan_tier: "gold" }, "2026-09-24").interval, "month");
  // Monthly goals and the weekly recap (2026-10-13)
  eq("goal: ends same day next month", C.goalEndDate("2026-10-13"), "2026-11-13");
  eq("goal: 31 Jan ends 28 Feb", C.goalEndDate("2026-01-31"), "2026-02-28");
  eq("goal: December rolls the year", C.goalEndDate("2026-12-15"), "2027-01-15");
  eq("goal: long date", C.longDate("2026-11-13"), "Friday 13 November");
  eq("goal: weight options at 82.4 kg", C.goalOptions("weight", { weightKg: 82.4 }).map((o) => o.target), [1, 2, 3]);
  eq("goal: weight options at 60 kg", C.goalOptions("weight", { weightKg: 60 }).map((o) => o.target), [1, 1.5, 2.5]);
  eq("goal: weight options tags", C.goalOptions("weight", { weightKg: 82.4 }).map((o) => o.tag), ["Easy", "Recommended", "A push"]);
  eq("goal: no weigh-in, no weight options", C.goalOptions("weight", {}), []);
  eq("goal: bench 80 x 11 options", C.goalOptions("strength", { lift: { exercise: "Bench", kg: 80, reps: 11 } }).map((o) => o.label), ["82.5 kg × 11", "85 kg × 11", "87.5 kg × 11"]);
  eq("goal: light lifts go up 1 kg", C.goalOptions("strength", { lift: { exercise: "Lateral Raise", kg: 9, reps: 10 } }).map((o) => o.target), [10, 11, 12]);
  eq("goal: sessions options from 3.6 a week", C.goalOptions("sessions", { sessionsPerWeek: 3.6 }).map((o) => o.target), [4, 5, 6]);
  eq("goal: green options never below 1", C.goalOptions("green", { greenPerWeek: 0 }).map((o) => o.target), [1, 2, 3]);
  const wGoal = { type: "weight", target: 2, start_value: 82.4, start_date: "2026-10-13", end_date: "2026-11-13", how: ["Hit my protein most days", "Walk 20 minutes after dinner"], why: "keep up with my grandkids" };
  eq("goal: sentence", C.goalSentence(wGoal), "By Friday 13 November I will lose 2 kg. To get there I'll hit my protein most days and walk 20 minutes after dinner, so I can keep up with my grandkids.");
  eq("goal: sentence without how", C.goalSentence(Object.assign({}, wGoal, { how: [] })), "By Friday 13 November I will lose 2 kg. That way I can keep up with my grandkids.");
  const wp = C.goalProgress(wGoal, { weights: [{ date: "2026-10-20", kg: 81.6 }] }, "2026-10-27");
  eq("goal: weight progress", [wp.pct, wp.status, wp.statusText, wp.nowValue], [40, "on track", "On track: 0.8 kg down so far", "81.6 kg"]);
  eq("goal: weight over target suggests calories", C.goalProgress(wGoal, { weights: [], kcal: { avg: 2250, target: 2000, proteinShortDays: 0, loggedDays: 12 } }, "2026-10-27").quicker[0], "You've averaged 2,250 calories a day against your 2,000 target. Closing that gap gets you there sooner.");
  eq("goal: behind says keep going", C.goalProgress(wGoal, { weights: [{ date: "2026-11-01", kg: 82.4 }] }, "2026-11-05").status, "behind");
  const sGoal = { type: "strength", exercise: "Barbell Bench Press", target: 85, target_reps: 8, start_value: 80, start_reps: 11, start_date: "2026-10-13", end_date: "2026-11-13" };
  const sp = C.goalProgress(sGoal, { sets: [{ date: "2026-10-20", exercise: "barbell bench press", kg: 85, reps: 8 }] }, "2026-10-21");
  eq("goal: strength reached", [sp.status, sp.pct], ["done", 100]);
  const nGoal = { type: "sessions", target: 3, start_date: "2026-10-12", end_date: "2026-11-12" };
  const nSets = ["2026-10-13", "2026-10-15", "2026-10-16", "2026-10-20"].map((d) => ({ date: d, exercise: "Squat", kg: 60, reps: 5 }));
  const np = C.goalProgress(nGoal, { sets: nSets }, "2026-10-21");
  eq("goal: sessions progress", [np.statusText, np.nowValue, np.status], ["On track: 1 of 1 week hit", "1 so far", "on track"]);
  eq("goal: ended month", C.goalProgress(nGoal, { sets: nSets }, "2026-11-20").ended, true);
  eq("goal: day one says just started", C.goalProgress(sGoal, { sets: [] }, "2026-10-13").statusText, "Just started: no Barbell Bench Press logged yet");
  eq("recap: same lift whatever the spelling", C.liftKey("Calf Raises"), C.liftKey("calf raise"));
  eq("recap: elephants", C.weightComparison(31642).text, "about 5 elephants");
  eq("recap: legs skip the elephant", C.weightComparison(21117, "elephant").text, "about 9 rhinos");
  eq("recap: too light to compare", C.weightComparison(100), null);
  const rSets = [
    { date: "2026-09-30", exercise: "Bench", kg: 80, reps: 10 },
    { date: "2026-10-06", exercise: "Bench", kg: 80, reps: 11 },
    { date: "2026-10-06", exercise: "Squat", kg: 60, reps: 10 },
    { date: "2026-10-08", exercise: "Pull-Up", kg: 0, reps: 8 },
  ];
  const rw = C.weekRecap(rSets, "2026-10-05");
  eq("recap: week totals", [rw.totalKg, rw.prevKg, rw.sets, rw.workouts], [1480, 800, 3, 2]);
  eq("recap: a new best only beats earlier weeks", rw.bests.map((b) => `${b.exercise} ${b.kg}x${b.reps}`), ["Bench 80x11"]);
  eq("recap: thousands", C.thousands(31642), "31,642");
  // The meal planner (2026-10-29): the client's picks and serves
  const it = (name, grams, kcal, p, extra) => Object.assign({ name, grams, kcal, protein_g: p, carbs_g: 0, fat_g: 0, aisle: "Pantry" }, extra || {});
  const oats = { name: "Oats", items: [it("Rolled oats", 60, 225, 8), it("Banana", 120, 105, 1, { count: 1, unit: "banana", aisle: "Fruit and veg" })] };
  const stir = { name: "Stir-fry", items: [it("Chicken breast", 150, 250, 46, { aisle: "Meat and fish" }), it("Soy sauce", 15, 10, 1, { pantry: true })] };
  const salmon = { name: "Salmon", items: [it("Salmon fillet", 150, 300, 30, { count: 1, unit: "fillet", aisle: "Meat and fish" })] };
  const planner = {
    days: {
      "2026-10-28": { breakfast: { meal: oats, serves: 1 } }, // yesterday: not shopped for
      "2026-10-29": { breakfast: { meal: oats, serves: 1 }, dinner: { meal: stir, serves: 2 } },
      "2026-10-30": { breakfast: { meal: oats, serves: 1.5 }, dinner: { meal: salmon, serves: 2 } },
    },
  };
  eq("planner: a day adds up the picks and serves", C.plannerDayTotals(planner.days["2026-10-29"]), { kcal: 330 + 520, protein_g: 9 + 94, carbs_g: 0, fat_g: 0 });
  eq("planner: a pick at 1.5 serves", C.pickTotals({ meal: oats, serves: 1.5 }).kcal, 495);
  const shop = C.plannerShopping(planner, "2026-10-29");
  const find = (n) => shop.find((x) => x.name === n);
  eq("planner: chicken is 2 serves of 150 g", find("Chicken breast").amount, "300 g");
  eq("planner: counted things round up", [find("Banana").amount, find("Salmon fillet").amount], ["3 bananas", "2 fillets"]);
  eq("planner: grams round up to 50 g", find("Rolled oats").amount, "150 g");
  eq("planner: days before 'from' aren't shopped for", C.plannerShopping(planner, "2026-10-30").find((x) => x.name === "Chicken breast"), undefined);
  eq("planner: pantry staples are flagged", find("Soy sauce").pantry, true);
  eq("planner: aisle order", shop.map((x) => x.aisle).filter((a, i, all) => all.indexOf(a) === i), ["Fruit and veg", "Meat and fish", "Pantry"]);
  eq("planner: serves steps", [C.stepServes(1, 1), C.stepServes(1, -1), C.stepServes(0.5, -1), C.stepServes(4, 1)], [1.5, 0.5, 0.5, 4]);
  eq("planner: serves text", [C.servesText(0.5), C.servesText(1), C.servesText(1.5), C.servesText(2)], ["½", "1", "1½", "2"]);
  eq("plan: plural units", [C.shoppingAmount(0, 2, "loaf"), C.shoppingAmount(0, 2, "peach"), C.shoppingAmount(0, 1, "egg")], ["2 loaves", "2 peaches", "1 egg"]);

  // --- Progress: green days, weeks, weight trend, goal pace ------------------------------------
  eq("mondayOf a Thursday", C.mondayOf("2026-09-24"), "2026-09-21");
  eq("mondayOf a Monday", C.mondayOf("2026-09-21"), "2026-09-21");
  eq("mondayOf a Sunday belongs to the week before", C.mondayOf("2026-09-27"), "2026-09-21");

  const hist = [
    { effective_date: "2026-09-01", kcal: 2100, protein_g: 150, carbs_g: 220, fat_g: 60 },
    { effective_date: "2026-09-15", kcal: 1800, protein_g: 140, carbs_g: 170, fat_g: 55 },
    { effective_date: "2026-09-15", kcal: 1850, protein_g: 140, carbs_g: 180, fat_g: 55 },
  ];
  eq("targetOn before any target", C.targetOn(hist, "2026-08-31"), null);
  eq("targetOn first step", C.targetOn(hist, "2026-09-10").kcal, 2100);
  eq("targetOn: a same-day change uses the later row", C.targetOn(hist, "2026-09-15").kcal, 1850);
  eq("targetOn after a clear is null", C.targetOn(hist.concat([{ effective_date: "2026-09-20", kcal: 0 }]), "2026-09-22"), null);

  const T = { kcal: 2000, protein_g: 150 };
  eq("green: on target", C.isGreenDay({ kcal: 2000, protein_g: 150 }, T), true);
  eq("green: protein exactly 90%", C.isGreenDay({ kcal: 2000, protein_g: 135 }, T), true);
  eq("not green: protein 89.9%", C.isGreenDay({ kcal: 2000, protein_g: 134.85 }, T), false);
  eq("green: kcal exactly +10%", C.isGreenDay({ kcal: 2200, protein_g: 150 }, T), true);
  eq("green: kcal exactly -10%", C.isGreenDay({ kcal: 1800, protein_g: 150 }, T), true);
  eq("not green: kcal +10.1%", C.isGreenDay({ kcal: 2202, protein_g: 150 }, T), false);
  eq("not green: nothing logged", C.isGreenDay({ kcal: 0, protein_g: 0 }, T), false);
  eq("not green: no target", C.isGreenDay({ kcal: 2000, protein_g: 150 }, null), false);

  const wkHist = [{ effective_date: "2026-09-01", kcal: 2000, protein_g: 150 }];
  const onT = { kcal: 1990, protein_g: 152 };
  const offT = { kcal: 2600, protein_g: 150 };
  const five = { "2026-09-21": onT, "2026-09-22": onT, "2026-09-23": offT, "2026-09-24": onT, "2026-09-25": onT, "2026-09-27": onT, "2026-09-28": onT };
  const w5 = C.weekSummary(five, wkHist, "2026-09-21");
  eq("week: 5 green of 7 earns a punch", [w5.greenDays, w5.earnsPunch], [5, true]);
  eq("week: Monday after is not counted", w5.days.map((d) => d.date)[6], "2026-09-27");
  eq("week: a missed day is logged-but-not-green", [w5.days[2].logged, w5.days[2].green], [true, false]);
  eq("week: an empty day is not logged", w5.days[5].logged, false);
  const four = Object.assign({}, five, { "2026-09-27": offT });
  eq("week: 4 green of 7 doesn't earn", C.weekSummary(four, wkHist, "2026-09-21").earnsPunch, false);

  const ma = C.movingAverage([
    { date: "2026-09-03", kg: 80 },
    { date: "2026-09-01", kg: 81 },
    { date: "2026-09-02", kg: 79 },
    { date: "2026-09-10", kg: 78 },
  ], 7);
  eq("trend: sorted by date", ma.map((p) => p.date), ["2026-09-01", "2026-09-02", "2026-09-03", "2026-09-10"]);
  eq("trend: averages the last 7 days", ma[2].kg, 80);
  eq("trend: a gap drops old weigh-ins", ma[3].kg, 78);

  const cut = C.goalPace("2026-09-01", 80, -0.5, 78, "2026-12-01");
  eq("pace: cut reaches goal in 4 weeks", [cut[1].date, cut[1].kg, cut[1].goalReached], ["2026-09-29", 78, true]);
  const cutShort = C.goalPace("2026-09-01", 80, -0.5, 70, "2026-09-15");
  eq("pace: stops at the chart's end if the goal's further out", [cutShort[1].date, cutShort[1].kg, cutShort[1].goalReached], ["2026-09-15", 79, false]);
  const gain = C.goalPace("2026-09-01", 70, 0.25, 72, "2027-01-01");
  eq("pace: lean gain goes up", [gain[1].date, gain[1].kg], ["2026-10-27", 72]);
  eq("pace: goal in the wrong direction is ignored", C.goalPace("2026-09-01", 80, -0.5, 85, "2026-09-15")[1].kg, 79);
  eq("pace: no rate, no line", C.goalPace("2026-09-01", 80, 0, 75, "2026-12-01").length, 0);

  // --- report -------------------------------------------------------------------------
  const failed = results.filter((x) => !x.ok);
  document.getElementById("summary").textContent = `${results.length - failed.length} passed, ${failed.length} failed`;
  document.getElementById("summary").className = failed.length ? "fail" : "pass";
  document.getElementById("results").innerHTML = results
    .map(
      (x) =>
        `<li class="${x.ok ? "pass" : "fail"}">${x.ok ? "✓" : "✗"} ${x.name}${x.ok ? "" : ` — got ${JSON.stringify(x.actual)}, expected ${JSON.stringify(x.expected)}`}</li>`
    )
    .join("");
  window.__testResults = { passed: results.length - failed.length, failed: failed.length, failures: failed };
</script>
