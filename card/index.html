<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>MaxFit — Membership Card</title>

<!-- PWA / installability. The manifest is added for Android/desktop only.
     On iPhone/iPad the home-screen app gets its own storage, separate from
     Safari, and iOS opens the manifest's start_url (the bare /card/), so the
     icon would forget whose card it is. With no manifest, iOS saves the exact
     personal link (?id=…&k=…) the client added it from. The apple-* tags
     below cover the icon, name and full-screen mode on iOS. -->
<script>
  (function () {
    var ua = navigator.userAgent;
    var ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1 && !/Android/.test(ua));
    if (ios) return;
    var link = document.createElement("link");
    link.rel = "manifest";
    link.href = "manifest.json";
    document.head.appendChild(link);
  })();
</script>
<meta name="theme-color" content="#111111" />
<meta name="mobile-web-app-capable" content="yes" />

<!-- iOS home screen behavior -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="MaxFit" />
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- The card's real data comes from these two origins (sheet.js, macros-api.js) — warm up the connection early so the first fetch isn't stuck doing DNS/TLS on top of the round-trip. -->
<link rel="preconnect" href="https://docs.google.com" />
<link rel="preconnect" href="https://script.google.com" />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css?v=20261003a" />
<link rel="stylesheet" href="macros.css?v=20261003a" />
</head>
<body>

<!-- Covers the card until the first real data arrives — hidden by app.js once loadCard() resolves (or immediately if the name picker shows instead). -->
<div class="card-loading" id="cardLoading">
  <svg class="card-loading__icon" viewBox="0 0 24 24" aria-hidden="true">
    <rect class="dumbbell__bar" x="8.5" y="11.25" width="7" height="1.5" rx="0.75" />
    <rect class="dumbbell__collar dumbbell__collar--l" x="6.5" y="9.5" width="2" height="5" rx="1" />
    <rect class="dumbbell__collar dumbbell__collar--r" x="15.5" y="9.5" width="2" height="5" rx="1" />
    <rect class="dumbbell__plate dumbbell__plate--l" x="1.5" y="7.5" width="4" height="9" rx="1.5" />
    <rect class="dumbbell__plate dumbbell__plate--r" x="18.5" y="7.5" width="4" height="9" rx="1.5" />
  </svg>
  <span class="card-loading__text">Loading your card</span>
</div>

<main class="card" id="card">
  <div class="card__top">
    <img class="card__wordmark" src="../assets/images/maxfit-logo.png" alt="MaxFit" />
    <span class="card__tag">Membership</span>
  </div>

  <div class="card__panel" id="panelCard" aria-label="Membership card">
  <div class="card__sessions-row">
    <div class="card__sessions">
      <span class="card__label card__label--red">Group Left</span>
      <span class="card__sessions-num card__sessions-num--split" id="groupSessionsNum">—</span>
    </div>
    <div class="card__sessions">
      <span class="card__label card__label--red">1-on-1 Left</span>
      <span class="card__sessions-num card__sessions-num--split" id="oneOnOneSessionsNum">—</span>
    </div>
  </div>

  <div class="card__meta">
    <div class="card__meta-item">
      <span class="card__label">Member</span>
      <span class="card__meta-value" id="memberName">—</span>
    </div>
    <div class="card__meta-item card__meta-item--right">
      <span class="card__label">Tier</span>
      <span class="card__meta-value" id="memberTier">—</span>
    </div>
  </div>

  <div class="card__loyalty">
    <div class="card__loyalty-head">
      <span class="card__label card__label--red">Sessions to Free</span>
      <span class="card__loyalty-count" id="loyaltyCount">—/10</span>
    </div>
    <div class="card__loyalty-bar" id="loyaltyBar"></div>
  </div>

  <div class="card__grid">
    <button class="card__tile" id="checkinTile" type="button">
      <svg class="card__tile-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V4H8M16 4H20V8M20 16V20H16M8 20H4V16"/></svg>
      <span class="card__tile-label">Check In</span>
      <span class="card__tile-value">Show your code</span>
    </button>

    <a class="card__tile" id="upcomingLink" href="https://www.maxfit.now/#programs" target="_blank" rel="noopener">
      <svg class="card__tile-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 7v10M4 9v6M20 9v6M17.5 7v10M6.5 12h11"/></svg>
      <span class="card__tile-label" id="upcomingLabel">Upcoming Session</span>
      <span class="card__tile-value" id="upcomingValue">—</span>
    </a>

    <!-- Shown by app.js for real members only (not the demo card). -->
    <a class="card__tile" id="bookLink" href="book.html" hidden>
      <svg class="card__tile-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span class="card__tile-label">1-on-1 Sessions</span>
      <span class="card__tile-value">Book a session</span>
    </a>

    <!-- Shown by app.js for real members only (not the demo card). -->
    <a class="card__tile" id="referLink" href="refer.html" hidden>
      <svg class="card__tile-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.25"/><path d="M3.5 20c0-3.6 2.46-6 5.5-6s5.5 2.4 5.5 6"/><path d="M18 8v6M15 11h6"/></svg>
      <span class="card__tile-label">Refer a Friend</span>
      <span class="card__tile-value">Get your link</span>
    </a>
  </div>

  <button class="card__complete" id="completeButton" type="button">
    <span class="card__complete-box" id="completeBox" aria-hidden="true">
      <svg class="card__complete-check" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
    </span>
    Workout Completed
  </button>
  </div>

  <!-- Macro tracker — everything inside is drawn by macros.js -->
  <section class="card__panel fuel" id="panelFuel" aria-label="Fuel" hidden></section>
</main>

<!-- Macro tracker bottom sheet, toast and camera inputs (macros.js) -->
<div class="fuel-sheet" id="fuelSheet" hidden>
  <div class="fuel-sheet__backdrop" data-close></div>
  <div class="fuel-sheet__panel" role="dialog" aria-modal="true" aria-labelledby="fuelSheetTitle">
    <div class="fuel-sheet__grip" aria-hidden="true"></div>
    <div class="fuel-sheet__body" id="fuelSheetBody"></div>
  </div>
</div>
<div class="fuel-toast" id="fuelToast" role="status" aria-live="polite" hidden></div>
<input class="fuel-file" id="fuelPhotoInput" type="file" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true" />
<input class="fuel-file" id="fuelLibraryInput" type="file" accept="image/*" tabindex="-1" aria-hidden="true" />

<div class="status" id="status" hidden></div>

<div class="qr-modal" id="qrModal" hidden>
  <button class="qr-modal__backdrop" id="qrModalBackdrop" type="button" aria-label="Close"></button>
  <div class="qr-modal__panel" role="dialog" aria-modal="true" aria-labelledby="qrModalTitle">
    <button class="qr-modal__close" id="qrModalClose" type="button" aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <h2 class="qr-modal__title" id="qrModalTitle">Check In</h2>
    <div class="card__scan">
      <div class="card__qr" id="qrCode"></div>
      <span class="card__scan-caption">Scan at Front Desk</span>
    </div>
  </div>
</div>

<div class="celebrate" id="celebrate" hidden>
  <div class="celebrate__confetti" id="confetti"></div>
  <span class="celebrate__text">Nice Work</span>
</div>

<div class="picker" id="picker" hidden>
  <div class="picker__inner">
    <span class="card__tag">MaxFit</span>
    <h1 class="picker__title">What's your name?</h1>
    <p class="picker__hint">Only needs to happen once on this phone.</p>
    <form id="pickerForm" autocomplete="off">
      <input class="picker__input" id="pickerInput" type="text" placeholder="Full name" autocapitalize="words" />
      <button class="picker__submit" type="submit">Continue</button>
      <p class="picker__error" id="pickerError" hidden></p>
    </form>
  </div>
</div>

<script src="vendor/qrcode.js" defer></script>
<script src="sheet.js?v=20261001a" defer></script>
<script src="app.js?v=20261001b" defer></script>
<script src="macros-core.js?v=20260928a" defer></script>
<script src="macros-api.js?v=20260925a" defer></script>
<script src="macros.js?v=20261002e" defer></script>
<script src="bottom-nav.js?v=20261002b" defer></script>
</body>
</html>
