<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>MaxFit — Membership Card</title>

<!-- PWA / installability. The manifest is added for Android/desktop only.
     On iPhone/iPad the home-screen app gets its own storage, separate from
     Safari, and iOS opens the manifest's start_url (the bare /card/), so the
     icon would forget whose card it is. With no manifest, iOS saves the exact
     personal link (?id=…&k=…) the client added it from. The apple-* tags
     below cover the icon, name and full-screen mode on iOS. -->
<script>
  (function () {
    var ua = navigator.userAgent;
    var ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1 && !/Android/.test(ua));
    if (ios) return;
    var link = document.createElement("link");
    link.rel = "manifest";
    link.href = "manifest.json";
    document.head.appendChild(link);
  })();
</script>
<meta name="theme-color" content="#111111" />
<meta name="mobile-web-app-capable" content="yes" />

<!-- iOS home screen behavior -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="MaxFit" />
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css?v=20260913b" />
<link rel="stylesheet" href="macros.css?v=20260926a" />
</head>
<body>

<main class="card" id="card">
  <div class="card__top">
    <img class="card__wordmark" src="../assets/images/maxfit-logo.png" alt="MaxFit" />
    <span class="card__tag">Membership</span>
  </div>

  <div class="card__tabs" role="tablist" aria-label="Card sections">
    <button class="card__tab is-active" id="tabCard" type="button" role="tab" aria-selected="true" aria-controls="panelCard" data-tab="card">Card</button>
    <button class="card__tab" id="tabFuel" type="button" role="tab" aria-selected="false" aria-controls="panelFuel" data-tab="fuel">Fuel</button>
  </div>

  <div class="card__panel" id="panelCard" role="tabpanel" aria-labelledby="tabCard">
  <div class="card__sessions-row">
    <div class="card__sessions">
      <span class="card__label card__label--red">Group Left</span>
      <span class="card__sessions-num card__sessions-num--split" id="groupSessionsNum">—</span>
    </div>
    <div class="card__sessions">
      <span class="card__label card__label--red">1-on-1 Left</span>
      <span class="card__sessions-num card__sessions-num--split" id="oneOnOneSessionsNum">—</span>
    </div>
  </div>

  <div class="card__meta">
    <div class="card__meta-item">
      <span class="card__label">Member</span>
      <span class="card__meta-value" id="memberName">—</span>
    </div>
    <div class="card__meta-item card__meta-item--right">
      <span class="card__label">Tier</span>
      <span class="card__meta-value" id="memberTier">—</span>
    </div>
  </div>

  <a class="card__upcoming" id="upcomingLink" href="https://www.maxfit.now/#programs" target="_blank" rel="noopener">
    <div class="card__upcoming-text">
      <span class="card__label" id="upcomingLabel">Upcoming Session</span>
      <span class="card__upcoming-value" id="upcomingValue">—</span>
    </div>
    <svg class="card__upcoming-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 17L17 7M17 7H8M17 7V16"/></svg>
  </a>

  <!-- Shown by app.js for real members only (not the demo card). -->
  <div id="bookWrap" hidden>
    <a class="card__upcoming" id="bookLink" href="book.html">
      <div class="card__upcoming-text">
        <span class="card__label">1-on-1 Sessions</span>
        <span class="card__upcoming-value">Book a session</span>
      </div>
      <svg class="card__upcoming-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </a>
  </div>

  <div class="card__loyalty">
    <div class="card__loyalty-head">
      <span class="card__label card__label--red">Sessions to Free</span>
      <span class="card__loyalty-count" id="loyaltyCount">—/10</span>
    </div>
    <div class="card__loyalty-bar" id="loyaltyBar"></div>
  </div>

  <button class="card__complete" id="completeButton" type="button">
    <span class="card__complete-box" id="completeBox" aria-hidden="true">
      <svg class="card__complete-check" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
    </span>
    Workout Completed
  </button>

  <div class="card__scan">
    <div class="card__qr" id="qrCode"></div>
    <span class="card__scan-caption">Scan at Front Desk</span>
  </div>
  </div>

  <!-- Macro tracker — everything inside is drawn by macros.js -->
  <section class="card__panel fuel" id="panelFuel" role="tabpanel" aria-labelledby="tabFuel" hidden></section>
</main>

<!-- Macro tracker bottom sheet, toast and camera inputs (macros.js) -->
<div class="fuel-sheet" id="fuelSheet" hidden>
  <div class="fuel-sheet__backdrop" data-close></div>
  <div class="fuel-sheet__panel" role="dialog" aria-modal="true" aria-labelledby="fuelSheetTitle">
    <div class="fuel-sheet__grip" aria-hidden="true"></div>
    <div class="fuel-sheet__body" id="fuelSheetBody"></div>
  </div>
</div>
<div class="fuel-toast" id="fuelToast" role="status" aria-live="polite" hidden></div>
<input class="fuel-file" id="fuelPhotoInput" type="file" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true" />
<input class="fuel-file" id="fuelLibraryInput" type="file" accept="image/*" tabindex="-1" aria-hidden="true" />

<div class="status" id="status" hidden></div>

<div class="celebrate" id="celebrate" hidden>
  <div class="celebrate__confetti" id="confetti"></div>
  <span class="celebrate__text">Nice Work</span>
</div>

<div class="picker" id="picker" hidden>
  <div class="picker__inner">
    <span class="card__tag">MaxFit</span>
    <h1 class="picker__title">What's your name?</h1>
    <p class="picker__hint">Only needs to happen once on this phone.</p>
    <form id="pickerForm" autocomplete="off">
      <input class="picker__input" id="pickerInput" type="text" placeholder="Full name" autocapitalize="words" />
      <button class="picker__submit" type="submit">Continue</button>
      <p class="picker__error" id="pickerError" hidden></p>
    </form>
  </div>
</div>

<script src="vendor/qrcode.js"></script>
<script src="sheet.js?v=20260925a"></script>
<script src="app.js?v=20260926a"></script>
<script src="macros-core.js?v=20260926a"></script>
<script src="macros-api.js?v=20260925a"></script>
<script src="macros.js?v=20260926a"></script>
</body>
</html>
