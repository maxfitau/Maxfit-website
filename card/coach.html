<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>MaxFit Coach Fuel</title>
<meta name="theme-color" content="#111111" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css?v=20260913b" />
<link rel="stylesheet" href="macros.css?v=20260923a" />
<style>
  html, body { height: auto; }
  .coach [hidden] { display: none !important; }
  body { align-items: flex-start; }
  .coach { max-width: 560px; }
  .coach-client { display: flex; flex-direction: column; gap: 10px; }
  .coach-client + .coach-client { margin-top: 12px; }
  .coach-client__head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .coach-client__name { font-family: var(--font-head); font-weight: 800; text-transform: uppercase; font-size: 20px; letter-spacing: 0.02em; }
  .coach-client__meta { font-family: var(--font-body); font-size: 13px; color: var(--dim); }
  .coach-link { font-family: var(--font-body); font-size: 12px; color: var(--grey); word-break: break-all; background: var(--bg-card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .coach-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .coach-actions .fuel-btn { width: auto; padding: 10px 14px; font-size: 13px; border-radius: 10px; }
  .coach-form { display: flex; flex-direction: column; gap: 10px; }
  .coach-check { display: flex; gap: 8px; align-items: center; font-family: var(--font-body); font-size: 13px; color: var(--grey); }
</style>
</head>
<body>

<main class="card coach" id="coach">
  <div class="card__top">
    <img class="card__wordmark" src="../assets/images/maxfit-logo.png" alt="MaxFit" />
    <span class="card__tag">Coach · Fuel</span>
  </div>
  <div id="coachBody"></div>
</main>

<div class="fuel-toast" id="fuelToast" role="status" aria-live="polite" hidden></div>

<script src="macros-core.js?v=20260923a"></script>
<script src="macros-api.js?v=20260923a"></script>
<script src="coach.js?v=20260923a"></script>
</body>
</html>
