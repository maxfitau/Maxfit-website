<style>
  html, body { height: auto; }
  .coach [hidden] { display: none !important; }
  body { align-items: flex-start; }
  .coach { max-width: 560px; }
  .coach-client { display: flex; flex-direction: column; gap: 10px; }
  .coach-client + .coach-client { margin-top: 12px; }
  .coach-client__head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .coach-client__name { font-family: var(--font-head); font-weight: 800; text-transform: uppercase; font-size: 20px; letter-spacing: 0.02em; }
  .coach-client__meta { font-family: var(--font-body); font-size: 13px; color: var(--dim); }
  .coach-link { font-family: var(--font-body); font-size: 12px; color: var(--grey); word-break: break-all; background: var(--bg-card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .coach-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .coach-actions .fuel-btn { width: auto; padding: 10px 14px; font-size: 13px; border-radius: 10px; }
  .coach-form { display: flex; flex-direction: column; gap: 10px; }
  .coach-check { display: flex; gap: 8px; align-items: center; font-family: var(--font-body); font-size: 13px; color: var(--grey); }
  /* Food Q&A safety test answers (2026-10-29) */
  .coach-safety { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
  .coach-qa { display: flex; flex-direction: column; gap: 6px; }
  .coach-qa__q { margin: 0; font-family: var(--font-body); font-weight: 600; font-size: 16px; color: var(--white); }
  .coach-qa__a { margin: 0; font-family: var(--font-body); font-size: 16px; line-height: 1.45; color: var(--grey); }
</style>
