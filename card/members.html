<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>MaxFit — App members</title>
<meta name="theme-color" content="#111111" />
<meta name="robots" content="noindex" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://docs.google.com" />
<link rel="preconnect" href="https://script.google.com" />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="clients.css?v=20261105a" />

<body>

<main class="card clients" id="clients">
  <div class="card__top">
    <a class="clients__back" id="backLink" href="./" aria-label="Back to my card">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <span class="card__tag">Coach tools</span>
  </div>

  <!-- The staff PIN form shows here until the page has loaded. -->
  <div id="gate"></div>
  <p class="clients__status" id="pageStatus" role="status"></p>

  <!-- The list: App members (people who asked to train are first) -->
  <section class="clients__list-view" id="listView" hidden>
    <div id="switchHost"></div>
    <p class="clients__status" id="listStatus" role="status"></p>
    <div class="clients__list" id="memberList"></div>
  </section>
</main>

<script src="sheet.js?v=20261105a" defer></script>
<script src="macros-core.js?v=20261029a" defer></script>
<script src="macros-api.js?v=20261029a" defer></script>

</body>
